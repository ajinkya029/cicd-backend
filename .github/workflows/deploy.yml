name: Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mern-cicd-backend:latest
            ghcr.io/${{ github.repository_owner }}/mern-cicd-backend:${{ github.sha }}
  # Optional deployment hook: configure DEPLOY_WEBHOOK_URL as a repository secret
  # for a hosting platform that supports deploy webhooks. No provider is assumed.
  deploy:
    needs: build-push
    if: ${{ vars.ENABLE_DEPLOY_WEBHOOK == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hosting provider deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL secret is required when ENABLE_DEPLOY_WEBHOOK=true"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_WEBHOOK_URL"
